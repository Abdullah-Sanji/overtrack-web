# Production web stack: nginx serving the built SPA and proxying /api to the API container.
# Joins the `overtrack` network created by over-track-api/docker-compose.prod.yml; bring that stack up first.
services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports: ["${WEB_PORT:-80}:80"]
    networks: [overtrack]
networks:
  overtrack:
    external: true
