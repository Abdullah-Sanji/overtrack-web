# Security headers for every response. nginx drops inherited add_header directives as soon as a
# location adds its own, so every location that sets a header includes this file again.
# HSTS is left to the TLS terminator in front of this container, which is the only thing that knows
# whether the site is served over https.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# The app is a same-origin SPA that talks to /api/ and loads Google Identity Services for sign-in.
# Google's documented CSP: https://developers.google.com/identity/gsi/web/guides/get-google-api-clientid#content_security_policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
