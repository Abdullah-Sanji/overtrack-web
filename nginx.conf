server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve the API container on each request (Docker DNS) so nginx starts before the API and survives
  # the API container being recreated with a new address. A literal upstream is resolved once at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  location ^~ /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 6m;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2|svg|png)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
